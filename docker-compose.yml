services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-bhs
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  stable-diffusion:
    build: ./sd
    image: black-hole-sd:latest
    container_name: stable-diffusion
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      - WEBUI_ARGS=--api --xformers --medvram
      - WEB_ENABLE_AUTH=false
      - CF_QUICK_TUNNELS=false
    volumes:
      - sd_data:/workspace
      - sd_models:/opt/stable-diffusion-webui/models
      - sd_extensions:/opt/stable-diffusion-webui/extensions
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: black-hole-backend
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - ollama
      - stable-diffusion
    volumes:
      - ./web2.html:/web2.html:ro
      - ./libs:/libs:ro
      - ./static:/static:ro
      - db_data:/app/data
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-qwen2.5vl:3b}
      - SD_HOST=http://stable-diffusion:7860
      - SD_STYLE_LORA=${SD_STYLE_LORA:-}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    restart: unless-stopped

  celery-worker:
    build: ./backend
    container_name: celery-worker
    depends_on:
      - redis
      - ollama
      - stable-diffusion
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - SD_HOST=http://stable-diffusion:7860
      - SD_STYLE_LORA=${SD_STYLE_LORA:-}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - db_data:/app/data
    command: celery -A tasks worker --loglevel=info --concurrency=1
    restart: unless-stopped

volumes:
  ollama_data:
  sd_data:
  sd_models:
  sd_extensions:
  db_data:
